<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragati's Interactive Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: white;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.2em;
            color: #a0aec0;
        }

        .instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            font-size: 14px;
            border: 2px solid #667eea;
        }

        .tooltip.visible {
            opacity: 1;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            z-index: 5;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h1>Pragati Toppo</h1>
        <p class="subtitle">Click the markers to explore my journey</p>
    </div>

    <div class="instructions">
        🌍 Drag to rotate • Scroll to zoom • Click markers to visit links
    </div>

    <div class="tooltip" id="tooltip"></div>
    <div id="loading">Loading Earth...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, globe, earth, clouds, markers = [];
        let raycaster, mouse, hoveredMarker = null;
        const tooltip = document.getElementById('tooltip');
        const loading = document.getElementById('loading');

        // Location data with coordinates and links
        const locations = [
            {
                name: "LinkedIn Profile",
                lat: 37.7749,
                lon: -122.4194,
                url: "https://www.linkedin.com/in/pragati-toppo",
                color: 0x0077b5
            },
            {
                name: "GitHub Profile",
                lat: 51.5074,
                lon: -0.1278,
                url: "https://github.com/yourusername",
                color: 0x6e5494
            },
            {
                name: "Download Resume",
                lat: 35.6762,
                lon: 139.6503,
                url: "PRAGATI-TOPPO-RESUME.pdf",
                color: 0xff6b6b,
                download: true
            },
            {
                name: "Portfolio Projects",
                lat: -33.8688,
                lon: 151.2093,
                url: "portfolio.html",
                color: 0x4ecdc4
            },
            {
                name: "Contact Me",
                lat: 40.7128,
                lon: -74.0060,
                url: "contact.html",
                color: 0xf9ca24
            },
            {
                name: "Blog Posts",
                lat: 19.0760,
                lon: 72.8777,
                url: "blog.html",
                color: 0x6c5ce7
            }
        ];

        function init() {
            scene = new Scene();
            camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.5;

            renderer = new WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);

            raycaster = new Raycaster();
            mouse = new Vector2();

            createStarfield();
            createEarth();
            createMarkers();
            createLights();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);

            animate();
        }

        function createStarfield() {
            const starsGeometry = new BufferGeometry();
            const starsMaterial = new PointsMaterial({
                color: 0xffffff,
                size: 0.02,
                transparent: true
            });

            const starsVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new Float32BufferAttribute(starsVertices, 3));
            const starField = new Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function createEarth() {
            globe = new Group();
            
            // Earth sphere with texture
            const geometry = new SphereGeometry(1, 64, 64);
            
            // Create canvas texture for Earth
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Create realistic Earth texture
            // Ocean
            ctx.fillStyle = '#1a4d7a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Continents (simplified)
            ctx.fillStyle = '#2d5a2d';
            
            // North America
            ctx.beginPath();
            ctx.arc(300, 300, 150, 0, Math.PI * 2);
            ctx.fill();
            
            // South America
            ctx.beginPath();
            ctx.arc(400, 600, 100, 0, Math.PI * 2);
            ctx.fill();
            
            // Europe
            ctx.beginPath();
            ctx.arc(1000, 250, 80, 0, Math.PI * 2);
            ctx.fill();
            
            // Africa
            ctx.beginPath();
            ctx.arc(1050, 500, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Asia
            ctx.beginPath();
            ctx.arc(1400, 300, 200, 0, Math.PI * 2);
            ctx.fill();
            
            // Australia
            ctx.beginPath();
            ctx.arc(1600, 650, 70, 0, Math.PI * 2);
            ctx.fill();
            
            // Add some variation to land
            ctx.fillStyle = '#3d7a3d';
            for (let i = 0; i < 100; i++) {
                ctx.beginPath();
                ctx.arc(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    Math.random() * 30 + 10,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            const texture = new CanvasTexture(canvas);
            
            const earthMaterial = new MeshPhongMaterial({
                map: texture,
                bumpScale: 0.05,
                specular: 0x333333,
                shininess: 15
            });

            earth = new Mesh(geometry, earthMaterial);
            globe.add(earth);

            // Add atmosphere glow
            const glowGeometry = new SphereGeometry(1.02, 64, 64);
            const glowMaterial = new MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.15,
                side: BackSide
            });
            const atmosphere = new Mesh(glowGeometry, glowMaterial);
            globe.add(atmosphere);

            // Add cloud layer
            const cloudGeometry = new SphereGeometry(1.01, 64, 64);
            const cloudCanvas = document.createElement('canvas');
            cloudCanvas.width = 2048;
            cloudCanvas.height = 1024;
            const cloudCtx = cloudCanvas.getContext('2d');
            
            cloudCtx.fillStyle = 'rgba(255, 255, 255, 0)';
            cloudCtx.fillRect(0, 0, cloudCanvas.width, cloudCanvas.height);
            
            cloudCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 50; i++) {
                cloudCtx.beginPath();
                cloudCtx.arc(
                    Math.random() * cloudCanvas.width,
                    Math.random() * cloudCanvas.height,
                    Math.random() * 60 + 20,
                    0,
                    Math.PI * 2
                );
                cloudCtx.fill();
            }
            
            const cloudTexture = new CanvasTexture(cloudCanvas);
            const cloudMaterial = new MeshPhongMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: 0.4,
                depthWrite: false
            });
            
            clouds = new Mesh(cloudGeometry, cloudMaterial);
            globe.add(clouds);

            scene.add(globe);
            loading.style.display = 'none';
        }

        function createMarkers() {
            locations.forEach(location => {
                const phi = (90 - location.lat) * (Math.PI / 180);
                const theta = (location.lon + 180) * (Math.PI / 180);

                const x = -(Math.sin(phi) * Math.cos(theta));
                const y = Math.cos(phi);
                const z = Math.sin(phi) * Math.sin(theta);

                // Create marker pin
                const pinGeometry = new ConeGeometry(0.03, 0.15, 8);
                const pinMaterial = new MeshPhongMaterial({
                    color: location.color,
                    emissive: location.color,
                    emissiveIntensity: 0.5
                });
                const pin = new Mesh(pinGeometry, pinMaterial);
                
                pin.position.set(x * 1.08, y * 1.08, z * 1.08);
                pin.lookAt(x * 2, y * 2, z * 2);
                
                pin.userData = location;
                markers.push(pin);
                globe.add(pin);

                // Create marker base (sphere)
                const baseGeometry = new SphereGeometry(0.04, 16, 16);
                const baseMaterial = new MeshPhongMaterial({
                    color: location.color,
                    emissive: location.color,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.8
                });
                const base = new Mesh(baseGeometry, baseMaterial);
                base.position.set(x * 1.04, y * 1.04, z * 1.04);
                base.userData = location;
                markers.push(base);
                globe.add(base);
            });
        }

        function createLights() {
            const ambientLight = new AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new DirectionalLight(0xffffff, 1);
            sunLight.position.set(5, 3, 5);
            scene.add(sunLight);

            const fillLight = new DirectionalLight(0x4488ff, 0.3);
            fillLight.position.set(-5, -3, -5);
            scene.add(fillLight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers);

            if (intersects.length > 0) {
                const marker = intersects[0].object;
                if (hoveredMarker !== marker) {
                    hoveredMarker = marker;
                    showTooltip(marker.userData.name, event.clientX, event.clientY);
                    document.body.style.cursor = 'pointer';
                }
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
            } else {
                if (hoveredMarker) {
                    hoveredMarker = null;
                    hideTooltip();
                    document.body.style.cursor = 'default';
                }
            }
        }

        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers);

            if (intersects.length > 0) {
                const location = intersects[0].object.userData;
                if (location.download) {
                    const link = document.createElement('a');
                    link.href = location.url;
                    link.download = location.url;
                    link.click();
                } else {
                    window.open(location.url, '_blank');
                }
            }
        }

        function showTooltip(text, x, y) {
            tooltip.textContent = text;
            tooltip.style.left = x + 15 + 'px';
            tooltip.style.top = y + 15 + 'px';
            tooltip.classList.add('visible');
        }

        function hideTooltip() {
            tooltip.classList.remove('visible');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                globe.rotation.y += deltaMove.x * 0.005;
                globe.rotation.x += deltaMove.y * 0.005;
            }

            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        document.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.001;
            camera.position.z = Math.max(1.5, Math.min(5, camera.position.z));
        });

        function animate() {
            requestAnimationFrame(animate);
            
            // Auto-rotate globe slowly
            if (!isDragging) {
                globe.rotation.y += 0.001;
            }

            // Rotate clouds slightly faster for realism
            if (clouds) {
                clouds.rotation.y += 0.0005;
            }

            // Animate markers
            markers.forEach((marker, index) => {
                const time = Date.now() * 0.001;
                const scale = 1 + Math.sin(time * 2 + index) * 0.1;
                marker.scale.set(scale, scale, scale);
            });

            renderer.render(scene, camera);
        }

        // Three.js class shorthands
        const {
            Scene,
            PerspectiveCamera,
            WebGLRenderer,
            SphereGeometry,
            ConeGeometry,
            MeshPhongMaterial,
            MeshBasicMaterial,
            Mesh,
            AmbientLight,
            DirectionalLight,
            Raycaster,
            Vector2,
            CanvasTexture,
            Group,
            BufferGeometry,
            PointsMaterial,
            Points,
            Float32BufferAttribute,
            BackSide
        } = THREE;

        init();
    </script>
</body>
</html>
